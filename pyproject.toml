[project]
name = "milo"
version = "0.1.0"
description = "Milo - conversational AI agent that creates, approves, publishes and monitors Meta ad campaigns"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "google-adk>=1.0",
    "litellm>=1.50",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10,<4",
    "mcp>=1.10,<2",
    "pymongo>=4.8",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "mongomock>=4.2",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
